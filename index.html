<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crop Cloud</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/hub.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn" data-action="main-menu" aria-label="Main menu" aria-haspopup="menu" aria-expanded="false"><span data-icon="menu" data-size="20"></span></button>
        <a class="brand" href="#home"><img src="assets/logo.svg" alt=""><span class="brand-name">Crop Cloud</span></a>
      </div>

      <div class="search">
        <div class="search-box">
          <span data-icon="search"></span>
          <input id="search-input" type="search" placeholder="Search apps, files, actions and settings" autocomplete="off" spellcheck="false"
            role="combobox" aria-label="Search" aria-controls="search-results" aria-expanded="false" aria-autocomplete="list">
          <kbd>Ctrl K</kbd>
        </div>
        <div class="search-results" id="search-results" role="listbox" hidden></div>
      </div>

      <div class="topbar-right">
        <span class="build-badge" id="build-badge" hidden></span>
        <button class="icon-btn" data-action="help-menu" aria-label="Help" aria-haspopup="menu" aria-expanded="false"><span data-icon="help" data-size="20"></span></button>
        <button class="icon-btn" id="bell-btn" data-action="notifications" aria-label="Notifications" aria-haspopup="true" aria-expanded="false">
          <span data-icon="bell" data-size="20"></span><span class="dot-badge" id="bell-count" hidden></span>
        </button>
        <button class="avatar-btn" id="avatar-btn" data-action="account-menu" aria-label="Account" aria-haspopup="menu" aria-expanded="false">
          <span class="avatar" id="avatar"></span>
        </button>
      </div>
    </header>

    <nav class="sidebar" aria-label="Main">
      <div id="nav"></div>
      <div class="sidebar-spacer"></div>
      <div class="storage" id="storage"></div>
      <button class="nav-item" data-action="prefs" title="Preferences (Ctrl ,)"><span data-icon="sliders" data-size="20"></span><span class="nav-label">Preferences</span></button>
    </nav>

    <main class="content" id="view" tabindex="-1"></main>
  </div>

  <div id="layer"></div>

  <div class="drop-overlay" id="drop-overlay" hidden>
    <div><span class="empty-icon"><span data-icon="upload" data-size="32"></span></span>Drop images to add them to Crop Cloud</div>
  </div>

  <input type="file" id="file-input" accept="image/*" multiple hidden>

  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/config.js"></script>
  <script src="js/vendor/supabase.js"></script>
  <script src="js/store.js"></script>
  <script src="js/filestore.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/platform.js"></script>
  <script src="js/account.js"></script>
  <script src="js/views.js"></script>
  <script src="js/hub.js"></script>
</body>
</html>
