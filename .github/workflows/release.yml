# Builds the Windows app and publishes a GitHub release when you push a version tag:
#   git tag v0.2.1 && git push origin v0.2.1
# The release holds the installer, the files the desktop app updates itself from
# (latest.yml + blockmap), one zip per app and apps-manifest.json.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Check the tag matches the version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match desktop/package.json ($version)."
            exit 1
          fi

      - run: npm ci

      - name: Build the installer and the app downloads
        run: npm run dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.exe dist/*.exe.blockmap dist/latest.yml dist/apps/* \
            --title "Crop Cloud ${GITHUB_REF_NAME#v}" --generate-notes
