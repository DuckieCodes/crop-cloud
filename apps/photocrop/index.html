<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PhotoCrop</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232f6bff'/%3E%3Cstop offset='1' stop-color='%2300c2ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='15' fill='white' text-anchor='middle'%3EPc%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/photocrop.css">
</head>
<body>
  <div class="pc-app">
    <header class="menubar" id="menubar"></header>
    <div class="options-bar" id="options-bar"></div>
    <div class="pc-main">
      <aside class="toolbar" id="toolbar" aria-label="Tools"></aside>
      <section class="workspace">
        <div class="doc-tabs" id="doc-tabs"></div>
        <div class="canvas-wrap">
          <div class="ruler-corner"></div>
          <canvas class="ruler ruler-top" id="ruler-top"></canvas>
          <canvas class="ruler ruler-left" id="ruler-left"></canvas>
          <div class="canvas-area" id="canvas-area"><canvas id="stage"></canvas></div>
        </div>
        <div class="status" id="status"></div>
        <div class="home-screen" id="home-screen" hidden></div>
      </section>
      <aside class="dock" id="dock" aria-label="Panels"></aside>
    </div>
  </div>

  <div id="overlay-layer"></div>
  <div id="toasts" class="ptoasts" role="status" aria-live="polite"></div>
  <input type="file" id="file-input" hidden>

  <script src="../../js/icons.js"></script>
  <script src="../../js/store.js"></script>
  <script src="../../js/filestore.js"></script>
  <script src="js/icons.js"></script>
  <script src="../../js/kit/util.js"></script>
  <script src="js/adjustments.js"></script>
  <script src="js/history.js"></script>
  <script src="js/document.js"></script>
  <script src="js/selection.js"></script>
  <script src="../../js/kit/ui.js"></script>
  <script src="js/view.js"></script>
  <script src="js/tools.js"></script>
  <script src="js/paint.js"></script>
  <script src="js/select-tools.js"></script>
  <script src="js/transform.js"></script>
  <script src="js/dialogs.js"></script>
  <script src="js/panels.js"></script>
  <script src="js/options.js"></script>
  <script src="js/commands.js"></script>
  <script src="js/menus.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
